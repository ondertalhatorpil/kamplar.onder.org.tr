<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ÖnderKamp - Kamp Merkezi Rezervasyon Sistemi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Maven+Pro:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
      .page-loader-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fef2f2;
        transition: opacity 0.3s ease;
      }

      .page-loader-overlay.loader-hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* From Uiverse.io by cohencoo */
      .custom-loader {
        width: 70px;
        height: 70px;
        background: #b91b1b;
        border-radius: 50px;
        -webkit-mask: radial-gradient(circle 31px at 50% calc(100% + 13px),#000 95%,#0000) top 4px left 50%,
          radial-gradient(circle 31px,#000 95%,#0000) center,
          radial-gradient(circle 31px at 50% -13px,#000 95%,#0000) bottom 4px left 50%,
          linear-gradient(#000 0 0);
        mask: radial-gradient(circle 31px at 50% calc(100% + 13px),#000 95%,#0000) top 4px left 50%,
          radial-gradient(circle 31px,#000 95%,#0000) center,
          radial-gradient(circle 31px at 50% -13px,#000 95%,#0000) bottom 4px left 50%,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        animation: cu10 1.5s infinite;
      }

      @keyframes cu10 {
        0% {
          -webkit-mask-size: 0    18px,0    18px,0    18px,auto
        }

        16.67% {
          -webkit-mask-size: 100% 18px,0    18px,0    18px,auto
        }

        33.33% {
          -webkit-mask-size: 100% 18px,100% 18px,0    18px,auto
        }

        50% {
          -webkit-mask-size: 100% 18px,100% 18px,100% 18px,auto
        }

        66.67% {
          -webkit-mask-size: 0    18px,100% 18px,100% 18px,auto
        }

        83.33% {
          -webkit-mask-size: 0    18px,0    18px,100% 18px,auto
        }

        100% {
          -webkit-mask-size: 0    18px,0    18px,0    18px,auto
        }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader" class="page-loader-overlay">
      <div class="custom-loader"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
